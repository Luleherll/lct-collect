name: CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: ['codex/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run check
      - run: npm run test:ci
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
