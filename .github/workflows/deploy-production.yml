name: Deploy production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: github.repository == 'Luleherll/lct-collect' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: lct-production
      cancel-in-progress: false
    env:
      PUBLIC_APP_ENV: production
      FIREBASE_PROJECT_ID: lct-collect-prod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record deployed source
        run: git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Load public production configuration
        run: cp .env.production.example .env
      - name: Verify environment separation
        run: |
          node scripts/check-env.mjs
          node --env-file=.env -e "if(process.env.PUBLIC_FIREBASE_PROJECT_ID!==process.env.FIREBASE_PROJECT_ID)process.exit(1)"
      - run: npm ci
      - run: npm run check
      - run: npm run test:ci
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - uses: google-github-actions/auth@v2
        with:
          project_id: lct-collect-prod
          workload_identity_provider: projects/275805072037/locations/global/workloadIdentityPools/lct-github-prod/providers/github
          service_account: lct-github-prod@lct-collect-prod.iam.gserviceaccount.com
      - name: Deploy Firestore rules and indexes
        run: npx -y firebase-tools@15.34.1 deploy --only firestore:rules,firestore:indexes --project "$FIREBASE_PROJECT_ID" --non-interactive
      - name: Deploy production live
        run: npx -y firebase-tools@15.34.1 deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
